<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 640" font-family="system-ui, 'Segoe UI', sans-serif" font-size="13">
  <title>Wiring: what is soldered to what</title>
  <rect width="980" height="640" fill="#ffffff"/>
  <defs>
    <style>
      .box { fill: #f4f3f8; stroke: #2a2933; stroke-width: 1.5; rx: 8; }
      .name { font-weight: 700; font-size: 14px; fill: #1b1a24; }
      .pin { fill: #1b1a24; }
      .note { fill: #5b5970; font-size: 12px; }
      .w { fill: none; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
      .power { stroke: #d4352c; } .ground { stroke: #2a2933; } .signal { stroke: #2f6fe0; } .audio { stroke: #1f9d55; } .usb { stroke: #8a56d8; }
    </style>
  </defs>

  <!-- Battery board -->
  <rect class="box" x="40" y="60" width="230" height="250"/>
  <text class="name" x="55" y="84">Battery board (PiSugar 3 Plus)</text>
  <text class="note" x="55" y="102">printed side; all of this is soldered</text>
  <text class="note" x="55" y="117">before it goes under the Pi</text>
  <text class="pin" x="150" y="150" text-anchor="end">battery socket</text>
  <text class="pin" x="255" y="150" text-anchor="end">5VOUT</text>
  <text class="pin" x="255" y="180" text-anchor="end">GND (header)</text>
  <text class="pin" x="255" y="215" text-anchor="end">VIN pad</text>
  <text class="pin" x="255" y="240" text-anchor="end">GND pad</text>
  <text class="pin" x="255" y="270" text-anchor="end">PWR pad</text>
  <text class="pin" x="255" y="295" text-anchor="end">BAT pad</text>

  <!-- Battery -->
  <rect class="box" x="40" y="350" width="150" height="56"/>
  <text class="name" x="55" y="374">Battery</text>
  <text class="note" x="55" y="392">its plug, last of all</text>
  <path class="w power" d="M100 350 V160"/>

  <!-- Pi -->
  <rect class="box" x="370" y="60" width="240" height="330"/>
  <text class="name" x="385" y="84">Raspberry Pi 3A+ header</text>
  <text class="note" x="385" y="102">pin numbers on the 40-pin header</text>
  <text class="pin" x="385" y="135">pins 1–6, 9: the battery board's</text>
  <text class="pin" x="385" y="151">spring contacts, nothing to solder</text>
  <text class="pin" x="595" y="185" text-anchor="end">pin 8 · TX</text>
  <text class="pin" x="595" y="210" text-anchor="end">pin 10 · RX</text>
  <text class="pin" x="595" y="235" text-anchor="end">pin 17 · 3.3 V</text>
  <text class="pin" x="595" y="260" text-anchor="end">pin 22 · GPIO25</text>
  <text class="pin" x="595" y="295" text-anchor="end">pin 12 · BCLK</text>
  <text class="pin" x="595" y="320" text-anchor="end">pin 35 · LRCLK</text>
  <text class="pin" x="595" y="345" text-anchor="end">pin 40 · DIN</text>
  <text class="pin" x="595" y="370" text-anchor="end">pin 39 · GND</text>
  <text class="pin" x="385" y="370">USB-A port</text>

  <!-- Sensor -->
  <rect class="box" x="720" y="150" width="220" height="150"/>
  <text class="name" x="735" y="174">Motion sensor (BNO085)</text>
  <text class="pin" x="735" y="189">SCL</text>
  <text class="pin" x="735" y="214">SDA</text>
  <text class="pin" x="735" y="239">VIN, and a wire VIN–P1</text>
  <text class="pin" x="735" y="264">INT</text>
  <text class="pin" x="735" y="289">GND</text>
  <path class="w signal" d="M600 181 H725"/>
  <path class="w signal" d="M600 206 H725"/>
  <path class="w power" d="M600 231 H725"/>
  <path class="w signal" d="M600 256 H725"/>

  <!-- Amplifier -->
  <rect class="box" x="720" y="330" width="220" height="170"/>
  <text class="name" x="735" y="354">Amplifier (2 × MAX98357A)</text>
  <text class="pin" x="735" y="384">BCLK</text>
  <text class="pin" x="735" y="409">LRCLK</text>
  <text class="pin" x="735" y="434">DIN</text>
  <text class="pin" x="735" y="459">GND</text>
  <text class="pin" x="735" y="484">VCC</text>
  <path class="w audio" d="M600 291 H660 V380 H725"/>
  <path class="w audio" d="M600 316 H645 V405 H725"/>
  <path class="w audio" d="M600 341 H630 V430 H725"/>
  <path class="w ground" d="M600 366 H615 V455 H725"/>

  <!-- battery board to amplifier VCC and sensor GND -->
  <path class="w power" d="M260 146 H320 V540 H690 V480 H725"/>
  <path class="w ground" d="M260 176 H305 V560 H705 V285 H725"/>

  <!-- Speakers -->
  <rect class="box" x="720" y="530" width="100" height="70"/>
  <text class="name" x="733" y="556">Left</text>
  <text class="note" x="733" y="574">speaker</text>
  <rect class="box" x="840" y="530" width="100" height="70"/>
  <text class="name" x="853" y="556">Right</text>
  <text class="note" x="853" y="574">speaker</text>
  <path class="w audio" d="M770 500 V530"/>
  <path class="w audio" d="M890 500 V530"/>
  <text class="note" x="708" y="520" text-anchor="end">LEFT and RIGHT OUTPUT,</text>
  <text class="note" x="708" y="536" text-anchor="end">+ to + on both</text>

  <!-- Charging socket -->
  <rect class="box" x="40" y="440" width="190" height="62"/>
  <text class="name" x="55" y="464">Charging socket (USB-C)</text>
  <text class="note" x="55" y="482">VBUS red, GND black</text>
  <path class="w power" d="M260 211 H285 V456 H230"/>
  <path class="w ground" d="M260 236 H275 V476 H230"/>

  <!-- Power button -->
  <rect class="box" x="40" y="530" width="190" height="62"/>
  <text class="name" x="55" y="554">Power button</text>
  <text class="note" x="55" y="572">a key switch, its two legs</text>
  <path class="w signal" d="M260 266 H295 V546 H230"/>
  <path class="w signal" d="M260 291 H290 V566 H230"/>

  <!-- Launchpad -->
  <rect class="box" x="370" y="440" width="240" height="62"/>
  <text class="name" x="385" y="464">Launchpad Pro</text>
  <text class="note" x="385" y="482">USB-B; a cable of about 8 cm</text>
  <path class="w usb" d="M420 376 V440"/>

  <!-- Legend -->
  <g font-size="12">
    <path class="w power" d="M40 622 H70"/><text x="76" y="626" class="note">power</text>
    <path class="w ground" d="M140 622 H170"/><text x="176" y="626" class="note">ground</text>
    <path class="w signal" d="M240 622 H270"/><text x="276" y="626" class="note">signal</text>
    <path class="w audio" d="M340 622 H370"/><text x="376" y="626" class="note">sound</text>
    <path class="w usb" d="M440 622 H470"/><text x="476" y="626" class="note">USB</text>
  </g>
</svg>
