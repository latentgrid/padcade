name = "Soundboard"
kind = "page"
api = 1
version = "1.4.0"
colour = "#5fe07a"
about = "Play clips from your banks and build songs on eight looping tracks."
needs = ["Speaker"]
button = "top3"
buttons_stay_lit = true
banks = true
pad_actions = true
thing = "Clip"
things = "Clips"

[actions]
banks = "Shift · Banks"
volume = "Volume"
undo = "Undo"
delete = "Delete"
quantise = "Quantise"
duplicate = "Duplicate song"
click = "Click"
sustain = "Sustain pedal"
record = "Record on the first empty track"
performance = "Record performance (hold for Takes)"
takes = "Takes library"
songs = "Track Select · Songs"
play = "Stop Clip · Play / stop"
volume_up = "Volume up"
volume_down = "Volume down"
stop = "Stop all sounds"
next_bank = "Next bank"

[settings.volume]
label = "Volume when it starts"
type = "range"
min = 1
max = 5
default = 3

[settings.pressure_sensitive]
label = "Pressure sensitivity"
type = "switch"
default = true
note = "Use each pad’s strike response. Turn this off to play soft and hard taps at the same level."

[pad.mode]
label = "When pressed"
type = "choice"
default = "once"
choices = [["once", "Play once"], ["hold", "Play while held"], ["loop", "Loop until pressed again"]]

[pad.dynamics]
label = "Strike response"
type = "choice"
default = "auto"
choices = [["auto", "Clip default"], ["velocity", "Soft to loud"], ["fixed", "Fixed level"]]

[previous_buttons]
right1 = "volume_up"
right2 = "volume_down"
right8 = "stop"
bottom1 = "bank:0"
bottom2 = "bank:1"

[defaults]
factory_banks = 17

[defaults.buttons]
left1 = "banks"
left2 = "click"
left3 = "undo"
left4 = "delete"
left5 = "quantise"
left6 = "duplicate"
left8 = "performance"
bottom2 = "songs"
bottom5 = "volume"
bottom7 = "sustain"
bottom8 = "play"
right1 = "track:0"
right2 = "track:1"
right3 = "track:2"
right4 = "track:3"
right5 = "track:4"
right6 = "track:5"
right7 = "track:6"
