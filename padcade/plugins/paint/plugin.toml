name = "Paint"
kind = "game"
api = 2
version = "1.0.0"
colour = "#aa46ff"
about = "Draw on the pads, frame by frame, play it, and save it to the gallery or into Pixel Art."

[actions]
colour1 = "Red (again: dark red)"
colour2 = "Orange (again: brown)"
colour3 = "Yellow (again: lime)"
colour4 = "Green (again: dark green)"
colour5 = "Cyan (again: teal)"
colour6 = "Blue (again: navy)"
colour7 = "Purple (again: pink)"
colour8 = "White (again: grey)"
gallery = "Gallery of saved drawings"
save = "Save the drawing"
clear = "Clear this frame (press twice); in the gallery: delete the drawing"
plays = "Plays in Pixel Art"
previous = "Previous frame; in the gallery: previous drawing"
next = "Next frame; in the gallery: next drawing"
copy = "Copy this frame"
remove = "Remove this frame (press twice)"
play = "Play or stop"
speed = "Slower or faster"

# the colours down the right, the drawing on the left, the frames along the bottom
[defaults.buttons]
right1 = "colour1"
right2 = "colour2"
right3 = "colour3"
right4 = "colour4"
right5 = "colour5"
right6 = "colour6"
right7 = "colour7"
right8 = "colour8"
left1 = "gallery"
left2 = "save"
left3 = "clear"
left4 = "plays"
bottom3 = "previous"
bottom4 = "next"
bottom5 = "copy"
bottom6 = "remove"
bottom7 = "play"
bottom8 = "speed"
